name: Report a bug
description: Something in Unofficial Symphony Maestro isn't working.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Please send diagnostics with every bug.** They show what Maestro and the driver were doing, so we can investigate instead of guessing.

        1. Submit this issue and copy its link.
        2. In Maestro, turn on **Diagnostics** in App Settings › Diagnostics & Feedback, then make the problem happen.

           <img src="https://raw.githubusercontent.com/danielraffel/unofficial-symphony-maestro-mk1/main/.github/images/diagnostics-turn-on.png" width="600" alt="App Settings with Diagnostics turned on and the Stop Diagnostics button">

        3. Press **Stop Diagnostics**, paste the issue's link under **Existing GitHub issue**, and press **Agree and Send**.

           <img src="https://raw.githubusercontent.com/danielraffel/unofficial-symphony-maestro-mk1/main/.github/images/diagnostics-issue-link.png" width="600" alt="The diagnostics window, with the Existing GitHub issue field for the issue's link">

        The report goes privately to the developer, so there is no need to attach it here.
  - type: textarea
    id: what-happened
    attributes:
      label: What isn't working?
      description: What you did, what happened, and what you expected.
    validations:
      required: true
  - type: textarea
    id: working
    attributes:
      label: What is working?
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Maestro version
      description: App Settings › About. Maestro's Report a Bug fills this in, with the update channel and driver.
      placeholder: "0.9.23"
    validations:
      required: true
  - type: input
    id: connection
    attributes:
      label: Connection
      description: USB, ThunderBridge or Symphony 64 PCIe. Filled in when you come from Maestro's Report a Bug.
      placeholder: "ThunderBridge"
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac and macOS version
      placeholder: "Mac Studio M2, macOS 26.1"
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware
      description: The I/O modules in your Symphony, and any second unit or external converters. When you come from Maestro's Report a Bug, what Maestro detected is filled in (modules, firmware, converters); add anything it missed.
    validations:
      required: false
  - type: input
    id: doing
    attributes:
      label: DAW and sample rate
      description: Maestro fills in the sample rate; add your DAW and its buffer size.
    validations:
      required: false
  - type: dropdown
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Without diagnostics we usually can't find the cause.
      options:
        - I will send diagnostics with this issue's link
        - I already sent diagnostics
        - I can't record diagnostics (please say why above)
    validations:
      required: true
